<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dobbelstenen</title>
<meta name="theme-color" content="#1f4a3d" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12291f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dobbelstenen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/bricolage-grotesque-latin-500-normal.woff2") format("woff2")}@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:800;font-display:swap;src:url("fonts/bricolage-grotesque-latin-800-normal.woff2") format("woff2")}</style>
<style>
  :root {
    --table: #1f4a3d; --table-edge: #163629;
    --die: #f3ead7; --die-shade: #d9ccb0; --ink: #2a1e14;
    --text: #e9efe9; --muted: #a9bfb4; --accent: #e3b34c;
    --size: 100px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --table: #12291f; --table-edge: #0b1c15;
      --die: #e6dcc6; --die-shade: #c4b697; --text: #dfe8e2; --muted: #8fa89b;
    }
  }
  :root[data-theme="dark"] {
    --table: #12291f; --table-edge: #0b1c15;
    --die: #e6dcc6; --die-shade: #c4b697; --text: #dfe8e2; --muted: #8fa89b;
  }
  @media (max-width: 380px) { :root { --size: 84px; } }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 40%, var(--table) 0%, var(--table-edge) 100%);
    background-color: var(--table);
    color: var(--text);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2rem; padding: 1.5rem; overflow: hidden;
  }
  .tray {
    display: flex; gap: clamp(2.5rem, 12vw, 5rem);
    padding-top: 140px; /* room for the dice to fly up */
    perspective: 900px;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .slot { position: relative; width: var(--size); height: var(--size); }
  .shadow {
    position: absolute; left: 10%; right: 10%; bottom: -14px; height: 16px;
    border-radius: 50%; background: rgba(0,0,0,.35); filter: blur(6px);
  }
  .scene { width: 100%; height: 100%; transform-style: preserve-3d; }
  .cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; }
  .face {
    position: absolute; inset: 0;
    background: var(--die); border-radius: 18%;
    display: grid; place-items: center;
    font-weight: 800; font-size: calc(var(--size) * .58); line-height: 1; color: var(--ink);
    box-shadow: inset 0 0 0 2px var(--die-shade), inset 0 -8px 16px rgba(0,0,0,.08);
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }
  .f-a { transform: rotateY(0deg)   translateZ(calc(var(--size) / 2)); }
  .f-f { transform: rotateY(180deg) translateZ(calc(var(--size) / 2)); }
  .f-b { transform: rotateY(90deg)  translateZ(calc(var(--size) / 2)); }
  .f-e { transform: rotateY(-90deg) translateZ(calc(var(--size) / 2)); }
  .f-c { transform: rotateX(90deg)  translateZ(calc(var(--size) / 2)); }
  .f-d { transform: rotateX(-90deg) translateZ(calc(var(--size) / 2)); }

  .result {
    font-size: clamp(2.5rem, 12vw, 4rem); font-weight: 800; letter-spacing: .05em;
    min-height: 1.2em; color: var(--accent); text-align: center;
  }
  button {
    font: inherit; font-weight: 800; font-size: 1.15rem;
    padding: .9rem 2.6rem; border: 0; border-radius: 999px;
    background: var(--accent); color: var(--ink); cursor: pointer;
    box-shadow: 0 4px 0 #a97f26; transition: transform .08s, box-shadow .08s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #a97f26; }
  button:focus-visible, .tray:focus-visible { outline: 3px solid var(--text); outline-offset: 6px; }
  button:disabled { opacity: .7; cursor: default; }
  .face.pips {
    display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr);
    padding: 16%; gap: 4%; place-items: center;
  }
  .pip { width: 72%; aspect-ratio: 1; border-radius: 50%; background: var(--ink);
         box-shadow: inset 0 2px 3px rgba(0,0,0,.45); }
  .oct-face {
    position: absolute; left: 50%; top: 50%; transform-origin: 0 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }
  .oct-face svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .oct-face text { font-family: inherit; font-weight: 800; fill: #f4f7f2; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .options { display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; justify-content: center; }
  .seg {
    display: inline-flex; border-radius: 999px; padding: 3px;
    background: rgba(0,0,0,.25); border: 0; margin: 0;
  }
  .seg legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label {
    padding: .45rem 1rem; border-radius: 999px; cursor: pointer;
    font-weight: 500; color: var(--muted); font-size: .95rem;
  }
  .seg input:checked + label { background: var(--die); color: var(--ink); font-weight: 800; }
  .seg input:focus-visible + label { outline: 2px solid var(--text); outline-offset: 2px; }
  .slot[hidden] { display: none; }
  .history {
    font-weight: 500; color: var(--muted); font-size: .95rem;
    text-align: center; max-width: 22rem; line-height: 1.5; min-height: 3em;
  }
</style>
</head>
<body>
  <div class="options">
    <fieldset class="seg">
      <legend>Aantal dobbelstenen</legend>
      <input type="radio" name="count" id="c1" value="1" checked><label for="c1">1 steen</label>
      <input type="radio" name="count" id="c2" value="2"><label for="c2">2 stenen</label>
    </fieldset>
    <fieldset class="seg">
      <legend>Soort dobbelsteen</legend>
      <input type="radio" name="mode" id="mL" value="letters"><label for="mL">A–F</label>
      <input type="radio" name="mode" id="mN" value="numbers" checked><label for="mN">1–6</label>
      <input type="radio" name="mode" id="m8" value="d8"><label for="m8">1–8</label>
    </fieldset>
  </div>

  <div class="tray" id="tray" tabindex="0" role="button" aria-label="Gooi de dobbelstenen">
    <div class="slot"><div class="shadow"></div><div class="scene"><div class="cube">
      
    </div></div></div>
    <div class="slot"><div class="shadow"></div><div class="scene"><div class="cube">
      
    </div></div></div>
  </div>

  <div class="sr-only" id="result" aria-live="polite"></div>
  <button id="roll">Gooien</button>
  <div class="history" id="history">Tik op de knop of op de dobbelstenen.</div>

<script>
  // Cube rotation [X, Y] that brings each letter to the front
  const TARGET = { A:[0,0], B:[0,-90], C:[-90,0], D:[90,0], E:[0,90], F:[0,180] };
  const SETS = { letters: ["A","B","C","D","E","F"], numbers: ["1","2","3","4","5","6"] };
  const FACE_CLASS = ["f-a","f-b","f-c","f-d","f-e","f-f"];
  const POS = ["A","B","C","D","E","F"]; // cube positions; opposite faces: A–F, B–E, C–D (= 1–6, 2–5, 3–4)
  let mode = "numbers", count = 1;
  // Which cells of a 3x3 grid (0–8, row by row) hold a pip for 1–6
  const PIPS = [[4],[2,6],[2,4,6],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
  const DURATION = 1600;

  const dice = [...document.querySelectorAll(".slot")].map(slot => ({
    slot,
    scene: slot.querySelector(".scene"),
    cube: slot.querySelector(".cube"),
    shadow: slot.querySelector(".shadow"),
    x: 0, y: 0
  }));
  const resultEl = document.getElementById("result");
  const historyEl = document.getElementById("history");
  const btn = document.getElementById("roll");
  const tray = document.getElementById("tray");
  const history = [];
  let busy = false;

  function renderFaces() {
    dice.forEach(d => {
      d.cube.style.transform = ""; d.x = 0; d.y = 0; d.q = null;
      if (mode === "d8") { renderOct(d); return; }
      d.cube.innerHTML = SETS[mode].map((sym, i) => mode === "numbers"
        ? `<div class="face pips ${FACE_CLASS[i]}" aria-label="${sym}">` +
          Array.from({length: 9}, (_, c) =>
            PIPS[i].includes(c) ? '<span class="pip"></span>' : '<span></span>').join("") +
          `</div>`
        : `<div class="face ${FACE_CLASS[i]}">${sym}</div>`).join("");
    });
  }
  function applyCount() {
    dice[1].slot.hidden = count === 1;
    tray.setAttribute("aria-label", count === 1 ? "Gooi de dobbelsteen" : "Gooi de dobbelstenen");
  }
  function resetResults() {
    history.length = 0;
    resultEl.textContent = "";
    historyEl.textContent = "Tik op de knop of op de dobbelstenen.";
  }
  document.querySelectorAll('input[name="count"]').forEach(r => r.addEventListener("change", () => {
    count = Number(r.value); applyCount(); resetResults();
  }));
  document.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener("change", () => {
    mode = r.value; renderFaces(); resetResults();
  }));

  // ---------- 8-sided die (octahedron) ----------
  // Face normals by sign pattern; opposite faces add up to 9 (1–8, 2–7, 3–6, 4–5)
  const OCT = { 1:[1,1,1], 8:[-1,-1,-1], 2:[-1,1,-1], 7:[1,-1,1],
                3:[1,1,-1], 6:[-1,-1,1], 4:[-1,1,1], 5:[1,-1,-1] };
  const LIGHT = norm([-0.35, -0.6, 0.75]);           // from top-left, towards the viewer
  const TILT = matMul(rotX(16), rotY(-12));          // slight tilt so it looks 3D at rest
  const sub = (a,b) => a.map((v,i) => v - b[i]);
  const add = (a,b) => a.map((v,i) => v + b[i]);
  const mul = (a,k) => a.map(v => v * k);
  const dot = (a,b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
  const cross = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  function norm(a) { const l = Math.hypot(...a); return a.map(v => v / l); }
  function rotX(deg) { const t = deg*Math.PI/180, c = Math.cos(t), s = Math.sin(t);
    return [[1,0,0],[0,c,-s],[0,s,c]]; }
  function rotY(deg) { const t = deg*Math.PI/180, c = Math.cos(t), s = Math.sin(t);
    return [[c,0,s],[0,1,0],[-s,0,c]]; }
  function matMul(A,B) { return A.map(r => [0,1,2].map(j => r[0]*B[0][j] + r[1]*B[1][j] + r[2]*B[2][j])); }
  const matVec = (M,v) => M.map(r => dot(r, v));
  const css3d = M => `matrix3d(${M[0][0]},${M[1][0]},${M[2][0]},0,${M[0][1]},${M[1][1]},${M[2][1]},0,${M[0][2]},${M[1][2]},${M[2][2]},0,0,0,0,1)`;

  // Quaternions [w,x,y,z] for smooth tumbling between orientations
  function matToQuat(m) {
    const tr = m[0][0] + m[1][1] + m[2][2]; let w,x,y,z;
    if (tr > 0) { const S = Math.sqrt(tr+1)*2; w = .25*S; x = (m[2][1]-m[1][2])/S; y = (m[0][2]-m[2][0])/S; z = (m[1][0]-m[0][1])/S; }
    else if (m[0][0] > m[1][1] && m[0][0] > m[2][2]) { const S = Math.sqrt(1+m[0][0]-m[1][1]-m[2][2])*2; w = (m[2][1]-m[1][2])/S; x = .25*S; y = (m[0][1]+m[1][0])/S; z = (m[0][2]+m[2][0])/S; }
    else if (m[1][1] > m[2][2]) { const S = Math.sqrt(1+m[1][1]-m[0][0]-m[2][2])*2; w = (m[0][2]-m[2][0])/S; x = (m[0][1]+m[1][0])/S; y = .25*S; z = (m[1][2]+m[2][1])/S; }
    else { const S = Math.sqrt(1+m[2][2]-m[0][0]-m[1][1])*2; w = (m[1][0]-m[0][1])/S; x = (m[0][2]+m[2][0])/S; y = (m[1][2]+m[2][1])/S; z = .25*S; }
    return [w,x,y,z];
  }
  function quatToMat([w,x,y,z]) {
    return [[1-2*(y*y+z*z), 2*(x*y-z*w), 2*(x*z+y*w)],
            [2*(x*y+z*w), 1-2*(x*x+z*z), 2*(y*z-x*w)],
            [2*(x*z-y*w), 2*(y*z+x*w), 1-2*(x*x+y*y)]];
  }
  function quatMul(a,b) { return [
    a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3], a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2],
    a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1], a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]]; }
  function slerp(a,b,t) {
    let d = a[0]*b[0]+a[1]*b[1]+a[2]*b[2]+a[3]*b[3];
    if (d < 0) { b = b.map(v => -v); d = -d; }
    if (d > .9995) return norm4(a.map((v,i) => v + (b[i]-v)*t));
    const th = Math.acos(d), s = Math.sin(th);
    return a.map((v,i) => v*Math.sin((1-t)*th)/s + b[i]*Math.sin(t*th)/s);
  }
  function norm4(q) { const l = Math.hypot(...q); return q.map(v => v / l); }
  const axisAngle = (ax, ang) => [Math.cos(ang/2), ...ax.map(v => v*Math.sin(ang/2))];

  // Build geometry for one face: matrix that places a flat triangle on the solid
  function octGeometry(size) {
    const r = size * 0.62, side = r * Math.SQRT2, h = side * Math.sqrt(3) / 2;
    const faces = {};
    for (const [num, [sx,sy,sz]] of Object.entries(OCT)) {
      const n = norm([sx,sy,sz]);
      const V0 = [0, sy*r, 0];                     // apex: the corner the number points to
      let V1 = [sx*r, 0, 0], V2 = [0, 0, sz*r];
      let ex = mul(sub(V2, V1), 1/side);
      let ey = mul(sub(mul(add(V1, V2), .5), V0), 1/h);
      if (dot(cross(ex, ey), n) < 0) {              // keep the front of each face outward
        [V1, V2] = [V2, V1];
        ex = mul(sub(V2, V1), 1/side);
      }
      const O = sub(V0, mul(ex, side/2));
      const u = norm(sub(V0, mul(add(add(V0, V1), V2), 1/3)));   // "up" for the number
      const align = matMul(TILT, [cross(n, u), mul(u, -1), n]);  // rotation that shows this face upright
      faces[num] = {
        n, side, h, q: matToQuat(align),
        transform: `matrix3d(${ex},0,${ey},0,${n},0,${O},1)`
      };
    }
    return faces;
  }

  function renderOct(d) {
    const size = dice[0].slot.offsetWidth;
    d.geo = octGeometry(size);
    d.cube.innerHTML = Object.entries(d.geo).map(([num, f]) => {
      const fs = f.side * .3, cy = f.h * 2/3;
      const dotMark = num === "6"
        ? `<circle cx="${f.side/2 + fs*.42}" cy="${cy + fs*.36}" r="${fs*.08}" fill="#f4f7f2"/>` : "";
      return `<div class="oct-face" style="width:${f.side}px;height:${f.h}px;transform:${f.transform}">` +
        `<svg viewBox="0 0 ${f.side} ${f.h}" aria-hidden="true">` +
        `<polygon points="${f.side/2},0 ${f.side},${f.h} 0,${f.h}" stroke-width="1.5" stroke-linejoin="round"/>` +
        `<text x="${f.side/2}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-size="${fs}">${num}</text>` +
        dotMark + `</svg></div>`;
    }).join("");
    d.polys = [...d.cube.querySelectorAll("polygon")].map((p, i) => [p, Object.values(d.geo)[i].n]);
    if (!d.q) d.q = d.geo[1].q;
    setOct(d, d.q);
  }

  // Apply an orientation and shade each face by how much it faces the light
  function setOct(d, q) {
    const M = quatToMat(q);
    d.cube.style.transform = css3d(M);
    for (const [poly, n] of d.polys) {
      const diff = Math.max(0, dot(matVec(M, n), LIGHT));
      const col = `hsl(150, 58%, ${15 + 30 * diff}%)`;
      poly.setAttribute("fill", col); poly.setAttribute("stroke", col);
    }
  }

  function throwOct(d, num, idx) {
    const q0 = d.q, q1 = d.geo[num].q;
    const axis = norm([Math.random()-.5, Math.random()-.5, Math.random()-.5]);
    const turns = (3 + rand6() % 2) * 2 * Math.PI;   // whole turns, so start and end stay continuous
    const t0 = performance.now();
    flight(d, idx);
    (function frame(now) {
      const t = Math.min(1, (now - t0) / DURATION);
      const e = 1 - Math.pow(1 - t, 3);              // fast at first, slowing down as it lands
      setOct(d, quatMul(axisAngle(axis, turns * (1 - e)), slerp(q0, q1, e)));
      if (t < 1) requestAnimationFrame(frame);
    })(t0);
    d.q = q1;
  }
  function rand8() {
    const b = new Uint8Array(1); crypto.getRandomValues(b); return b[0] % 8;   // 256 is a multiple of 8: no bias
  }

  // Fair random integer 0..5 (no modulo bias)
  function rand6() {
    const b = new Uint8Array(1);
    do { crypto.getRandomValues(b); } while (b[0] >= 252);
    return b[0] % 6;
  }
  const rot = (x, y, z) => `rotateX(${x}deg) rotateY(${y}deg) rotateZ(${z}deg)`;

  function throwDie(d, pos, idx) {
    const [tx, ty] = TARGET[pos];
    // Several full turns on each axis, then land on the target letter
    const x1 = Math.ceil(d.x / 360) * 360 + (3 + rand6() % 2) * 360 + tx;
    const y1 = Math.ceil(d.y / 360) * 360 + (2 + rand6() % 2) * 360 + ty;
    const zTurns = (idx === 0 ? 1 : -1) * 360 * (1 + rand6() % 2);

    // Tumble: fast at first, slowing down as it lands
    const tumble = d.cube.animate([
      { transform: rot(d.x, d.y, 0) },
      { transform: rot(x1, y1, zTurns) }
    ], { duration: DURATION, easing: "cubic-bezier(.15,.6,.3,1)", fill: "forwards" });

    flight(d, idx);
    d.x = x1; d.y = y1;
    tumble.onfinish = () => {
      // Keep final position (z is a whole number of turns, so 0 looks identical)
      d.cube.style.transform = rot(x1, y1, 0);
      tumble.cancel();
    };
  }

  function flight(d, idx) {
    // Flight: thrown up, lands, bounces twice
    const side = (idx === 0 ? -1 : 1) * (20 + rand6() * 4);
    d.scene.animate([
      { transform: "translate(0,0)", offset: 0 },
      { transform: `translate(${side}px,-140px)`, offset: .22, easing: "ease-in" },
      { transform: `translate(${side * .4}px,0)`, offset: .48, easing: "ease-out" },
      { transform: `translate(${side * .2}px,-38px)`, offset: .62, easing: "ease-in" },
      { transform: "translate(0,0)", offset: .76, easing: "ease-out" },
      { transform: "translate(0,-10px)", offset: .85, easing: "ease-in" },
      { transform: "translate(0,0)", offset: 1 }
    ], { duration: DURATION });

    // Shadow shrinks while the die is in the air
    d.shadow.animate([
      { transform: "scale(1)", opacity: 1, offset: 0 },
      { transform: "scale(.45)", opacity: .35, offset: .22 },
      { transform: "scale(1)", opacity: 1, offset: .48 },
      { transform: "scale(.8)", opacity: .75, offset: .62 },
      { transform: "scale(1)", opacity: 1, offset: .76 },
      { transform: "scale(1)", opacity: 1, offset: 1 }
    ], { duration: DURATION });
  }

  function roll() {
    if (busy) return;
    busy = true; btn.disabled = true; lockOptions(true);
    resultEl.textContent = "";
    const active = dice.slice(0, count);
    let syms;
    if (mode === "d8") {
      const nums = active.map(() => rand8() + 1);
      active.forEach((d, i) => throwOct(d, nums[i], i));
      syms = nums.map(String);
    } else {
      const idx = active.map(() => rand6());
      active.forEach((d, i) => throwDie(d, POS[idx[i]], i));
      syms = idx.map(i => SETS[mode][i]);
    }
    setTimeout(() => {
      resultEl.textContent = "Gegooid: " + syms.join(" en ");
      history.unshift(syms.join(mode === "letters" ? "" : "·"));
      if (history.length > 10) history.pop();
      historyEl.textContent = history.length > 1
        ? "Vorige worpen: " + history.slice(1).join("   ") : " ";
      busy = false; btn.disabled = false; lockOptions(false);
    }, DURATION + 30);
  }
  function lockOptions(on) {
    document.querySelectorAll(".seg input").forEach(i => i.disabled = on);
  }

  renderFaces(); applyCount();
  let lastSize = dice[0].slot.offsetWidth;
  addEventListener("resize", () => {
    const sz = dice[0].slot.offsetWidth;
    if (sz !== lastSize && mode === "d8" && !busy) { lastSize = sz; dice.forEach(renderOct); }
    lastSize = sz;
  });
  btn.addEventListener("click", roll);
  tray.addEventListener("click", roll);
  tray.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); roll(); }
  });
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
